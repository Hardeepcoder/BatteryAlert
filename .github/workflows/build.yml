name: Build Battery Alert (Windows .exe & macOS .dmg)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "BatteryAlert" `
            --icon "icon/app.ico" `
            --add-data "assets;assets" `
            --add-data "config;config" `
            --add-data "icon;icon" `
            app.py

      - name: Compress Windows Executable Output
        shell: powershell
        run: |
          Compress-Archive -Path dist/BatteryAlert/* -DestinationPath dist/BatteryAlert-Windows.zip

      - name: Upload Windows Executable (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: BatteryAlert-Windows-exe
          path: dist/BatteryAlert-Windows.zip

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "BatteryAlert" \
            --icon "icon/app.icns" \
            --add-data "assets:assets" \
            --add-data "config:config" \
            --add-data "icon:icon" \
            app.py

      - name: Create DMG Disk Image
        run: |
          hdiutil create -volname "BatteryAlert" -srcfolder "dist/BatteryAlert.app" -ov -format UDZO "dist/BatteryAlert.dmg"

      - name: Upload macOS DMG (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: BatteryAlert-macOS-dmg
          path: dist/BatteryAlert.dmg
