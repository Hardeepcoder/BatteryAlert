name: Build & Release Battery Alert

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Windows Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "BatteryAlert" `
            --icon "icon/app.ico" `
            --add-data "assets;assets" `
            --add-data "config;config" `
            --add-data "icon;icon" `
            app.py

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/BatteryAlert.exe

  build-macos:
    name: Build macOS Installer (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "BatteryAlert" \
            --icon "icon/app.icns" \
            --add-data "assets:assets" \
            --add-data "config:config" \
            --add-data "icon:icon" \
            app.py

      - name: Create DMG Disk Image
        run: |
          hdiutil create -volname "BatteryAlert" -srcfolder "dist/BatteryAlert.app" -ov -format UDZO "dist/BatteryAlert.dmg"

      - name: Upload macOS Asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/BatteryAlert.dmg

  release:
    name: Create Official GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Asset
        uses: actions/download-artifact@v4
        with:
          name: windows-executable

      - name: Download macOS Asset
        uses: actions/download-artifact@v4
        with:
          name: macos-installer

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BatteryAlert.exe
            BatteryAlert.dmg
          name: Battery Alert ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
