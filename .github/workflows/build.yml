name: Build & Release Battery Alert

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (BatteryAlertSetup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Application Directory with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "BatteryAlert" `
            --icon "icon/app.ico" `
            --add-data "assets;assets" `
            --add-data "config;config" `
            --add-data "icon;icon" `
            app.py

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --no-progress -y

      - name: Compile Inno Setup Installer (BatteryAlertSetup.exe)
        shell: cmd
        run: |
          set TAG_NAME=${{ github.ref_name }}
          if "%TAG_NAME:~0,1%"=="v" set APP_VERSION=%TAG_NAME:~1%
          if "%APP_VERSION%"=="" set APP_VERSION=1.0.0
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%APP_VERSION% installer.iss

      - name: Upload Windows Setup Asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/BatteryAlertSetup.exe

  build-macos:
    name: Build macOS Installer (${{ matrix.arch-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch-name: Intel
            dmg-suffix: macOS-Intel
          - os: macos-latest
            arch-name: Apple Silicon
            dmg-suffix: macOS-AppleSilicon
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "BatteryAlert" \
            --icon "icon/app.icns" \
            --add-data "assets:assets" \
            --add-data "config:config" \
            --add-data "icon:icon" \
            --hidden-import "AppKit" \
            --hidden-import "objc" \
            app.py

      - name: Create DMG Disk Image
        run: |
          mkdir -p dist/dmg_root
          cp -R dist/BatteryAlert.app dist/dmg_root/
          ln -s /Applications dist/dmg_root/Applications
          hdiutil create -volname "Battery Alert" -srcfolder "dist/dmg_root" -ov -format UDZO "dist/BatteryAlert-${{ matrix.dmg-suffix }}.dmg"

      - name: Upload macOS Asset
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer-${{ matrix.dmg-suffix }}
          path: dist/BatteryAlert-${{ matrix.dmg-suffix }}.dmg

  release:
    name: Create Official GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Setup Asset
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Download macOS Intel Asset
        uses: actions/download-artifact@v4
        with:
          name: macos-installer-macOS-Intel

      - name: Download macOS Apple Silicon Asset
        uses: actions/download-artifact@v4
        with:
          name: macos-installer-macOS-AppleSilicon

      - name: Calculate SHA-256 Checksums
        run: |
          sha256sum BatteryAlertSetup.exe > checksums.txt
          sha256sum BatteryAlert-macOS-Intel.dmg >> checksums.txt
          sha256sum BatteryAlert-macOS-AppleSilicon.dmg >> checksums.txt
          echo "CHECKSUMS<<EOF" >> $GITHUB_ENV
          cat checksums.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BatteryAlertSetup.exe
            BatteryAlert-macOS-Intel.dmg
            BatteryAlert-macOS-AppleSilicon.dmg
          name: Battery Alert ${{ github.ref_name }}
          body: |
            ## 📥 Official Download Links

            - 🤖 **Android Package**: [Download BatteryAlert-Android-v1.0.0.apk](https://github.com/Hardeepcoder/BatteryAlert/releases/download/${{ github.ref_name }}/BatteryAlert-Android-v1.0.0.apk)
            - 🪟 **Windows Setup Installer**: [Download BatteryAlertSetup.exe](https://github.com/Hardeepcoder/BatteryAlert/releases/download/${{ github.ref_name }}/BatteryAlertSetup.exe)
            - 🍎 **macOS Disk Image (Intel)**: [Download BatteryAlert-macOS-Intel.dmg](https://github.com/Hardeepcoder/BatteryAlert/releases/download/${{ github.ref_name }}/BatteryAlert-macOS-Intel.dmg)
            - 🍎 **macOS Disk Image (Apple Silicon)**: [Download BatteryAlert-macOS-AppleSilicon.dmg](https://github.com/Hardeepcoder/BatteryAlert/releases/download/${{ github.ref_name }}/BatteryAlert-macOS-AppleSilicon.dmg)

            ---
            ### 🛠️ Microsoft Store & Silent Install Switches (Windows)
            To install silently without user prompts (e.g. for Microsoft Store / Enterprise deployment):
            ```cmd
            BatteryAlertSetup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
            ```

            ---
            ### 🔒 SHA-256 Checksums
            ```text
            ${{ env.CHECKSUMS }}
            ```

            *Automated Release generated by GitHub Actions CI/CD.*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
